name: image

# Builds ONE public multi-arch image (ghcr.io/raabteam/raab-analysis) from the
# single multi-stage docker/Dockerfile. The two arches build in parallel on
# NATIVE runners (no QEMU), each pushes by digest, then a manifest job stitches
# one multi-arch tag. Per-arch buildx layer caching keeps code-only builds fast.
# See docker/DL-2425-RAAB_IMAGE_CI_PLAN.md §8.

on:
  push:
    branches: [main,DL-2425-peek-integration-v2] # merge to main -> new image
  workflow_dispatch: {} # manual (first build, or force a dep rebuild)

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/raabteam/raab-analysis

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm } # native arm64, free for public repos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: app
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      # Export the pushed digest for this arch. The digest (sha256:...) contains
      # no '-', so encoding it in the filename after the arch prefix is safe.
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - id: tags
        run: echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      # Each artifact filename is a bare digest (sha256 stripped of its prefix).
      # Stitch the per-arch digests into ONE multi-arch tag.
      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          refs=()
          for f in *; do refs+=("${IMAGE}@sha256:${f}"); done
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${{ steps.tags.outputs.sha }}" \
            "${refs[@]}"

      - name: Inspect published manifest
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "${IMAGE}:${{ steps.tags.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
